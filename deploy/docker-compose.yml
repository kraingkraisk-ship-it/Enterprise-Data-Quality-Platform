  #     POSTGRES_DB: edqp
  #     POSTGRES_USER: edqp
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U edqp"]
  #     interval: 10s
  #     retries: 5
  #   # then set DATABASE_URL=postgresql://edqp:…@postgres:5432/edqp in the app service

  # ── PRODUCTION SWAP TARGET: Redis (enable together with rate-limit / Celery swap) ──
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes:
  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     retries: 5

volumes:
  db-data:
