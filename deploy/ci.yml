# EDQP — CI pipeline (GitHub Actions)
# Steps per delivery contract: checkout → setup bun → install → prisma generate
# → typecheck → lint → production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./db/custom.db"   # prisma generate / build need a resolvable datasource URL
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build (next standalone)
        run: bun run build
